version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: btrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: btrack
      POSTGRES_USER: btrack
      POSTGRES_PASSWORD: btrack
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: btrack-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/btrack
      DB_USERNAME: btrack
      DB_PASSWORD: btrack
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-must-be-256-bits-long}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
