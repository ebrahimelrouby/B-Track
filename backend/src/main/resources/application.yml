spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: btrack-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/btrack}
    username: ${DB_USERNAME:btrack}
    password: ${DB_PASSWORD:btrack}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # Flyway is the source of truth for schema. "validate" is kept off because
      # Hibernate 6.4's schema validator misreports Postgres enum-array columns
      # (e.g. muscle_group[]) as a type mismatch even though the column is correct.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

btrack:
  mail:
    from: ${MAIL_FROM:no-reply@btrack.app}

  # Twilio trial account — can only send to phone numbers verified in the Twilio
  # console. Upgrade the account (or swap provider) before production.
  sms:
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    twilio-from-number: ${TWILIO_FROM_NUMBER:}

  jwt:
    secret: ${JWT_SECRET:changeme-use-a-long-random-secret-in-production-256-bits}
    access-token-expiration: ${JWT_ACCESS_EXPIRY:900}       # 15 minutes in seconds
    refresh-token-expiration: ${JWT_REFRESH_EXPIRY:2592000} # 30 days in seconds

  ai:
    provider: ${AI_PROVIDER:gemini}   # openai | gemini
    rate-limit:
      requests-per-minute: 10
      requests-per-day: 100
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      model: gpt-4o
      vision-model: gpt-4o
      max-tokens: 800
      temperature: 0.2
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-2.5-flash
      vision-model: gemini-2.5-flash
      max-tokens: 800
      temperature: 0.2

  upload:
    max-file-size: 10MB
    allowed-types: image/jpeg,image/png,image/webp

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.btrack: INFO
    org.springframework.security: WARN
